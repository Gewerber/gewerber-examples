# Standalone (single-tenant) OSS deployment of the Gewerber backend.
#
# This is a deliberately simplified variant of the production stack in
# https://github.com/Gewerber/gewerber-backend/blob/main/deploy/docker-compose.yml:
#
#   - no Traefik / TLS termination: the API port is published directly,
#     suitable for a trusted LAN or for placing your own reverse proxy in
#     front (see self-hosted/README.md);
#   - no resource limits, no deploy script;
#   - same service names (`server`, `postgres`, `redis`) and database name
#     (`gewerber_backend`) as the production stack, so the upstream
#     backup.sh / restore.sh scripts work against this directory unchanged
#     (via DEPLOY_DIR override).
#
# Configuration comes from `.env` next to this file (copy `.env.example`).
#
services:
  server:
    # Prebuilt open-source image pushed by CI (GHCR).
    image: ${IMAGE:-ghcr.io/gewerber/gewerber-backend:prod-latest}
    # To build from source instead, clone
    # https://github.com/Gewerber/gewerber-backend next to this repo and
    # replace `image:` above with:
    #   build:
    #     context: ../../gewerber-backend
    #     dockerfile: gewerber_backend_server/Dockerfile
    container_name: ${CONTAINER_NAME:-gewerber-backend}
    restart: unless-stopped
    environment:
      # Serverpod run mode: production | staging (selects the matching
      # config/<runmode>.yaml baked into the image).
      runmode: ${RUNMODE:-production}
      # Apply pending database migrations on startup.
      SERVERPOD_APPLY_MIGRATIONS: "true"
    volumes:
      # Serverpod reads its secrets (database password, JWT keys, ...) from
      # this file at runtime. It is NOT part of the image and must be created
      # once before the first start — see self-hosted/README.md.
      - ./config/passwords.yaml:/app/config/passwords.yaml:ro
    ports:
      # API server published directly to the host/network. The Insights
      # server (8081) intentionally stays internal.
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: gewerber_backend
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gewerber_backend"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # NOTE: you can remove this service — the application code does not use
  # Redis today (audit in the upstream deploy README, section "Redis"). It is
  # kept here because the config/<runmode>.yaml shipped inside the prebuilt
  # image points at host `redis`; dropping the service without removing that
  # config section requires building your own image. See:
  # https://github.com/Gewerber/gewerber-backend/blob/main/deploy/README.md
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pure cache semantics: no RDB snapshots, no AOF — everything durable
    # lives in PostgreSQL.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
